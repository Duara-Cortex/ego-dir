name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel a superseded run on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job's timeout is a few times its usual run, so a hung job fails in
# minutes rather than at GitHub's six-hour default.
jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Kept short: this job gates merges.
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Tests
        run: make test

  integration:
    name: Integration Tests (gopls, pyright)
    runs-on: ubuntu-latest
    # Also builds gopls from source and installs pyright.
    timeout-minutes: 12
    env:
      # The golden files and lspfake follow these servers' output. Bump them on purpose.
      GOPLS_VERSION: v0.23.0
      PYRIGHT_VERSION: 1.1.414
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gopls
        run: |
          go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Fails the job here if gopls is missing, rather than letting the tests skip.
      - name: Check gopls
        run: gopls version

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pyright
        run: npm install --global "pyright@${PYRIGHT_VERSION}"

      # pyright-langserver has no --version; the pyright command of the same
      # package does. Fails the job if the server is missing or not the pinned one.
      - name: Check pyright
        run: |
          command -v pyright-langserver
          pyright --version | tee /dev/stderr | grep -qx "pyright ${PYRIGHT_VERSION}"

      # An explicit `shell: bash` runs with pipefail, so a test failure is not hidden by tee.
      - name: Run Integration Tests
        shell: bash
        run: |
          GOFLAGS=-v make integration 2>&1 | tee integration.log
          if grep -q 'gopls not on PATH' integration.log; then
            echo "::error::gopls integration tests were skipped"
            exit 1
          fi
          if grep -q 'pyright-langserver not on PATH' integration.log; then
            echo "::error::pyright integration tests were skipped"
            exit 1
          fi

  package:
    name: Cross-Compile
    runs-on: ubuntu-latest
    # Six platforms, built one after another.
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-Compile & Package Binaries
        run: VERSION=ci make package
